<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Master Craft Burger · La película</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1a1d22}
body{color:#f3ece0;font-family:'DM Sans',system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 42%,#3b404a 0%,#272b33 45%,#15171b 100%)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.scroll-space{height:700vh}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.14;mix-blend-mode:overlay;image-rendering:pixelated}
.bar{position:fixed;left:0;right:0;height:9vh;background:#000;z-index:5;pointer-events:none}
.bar.t{top:0}.bar.b{bottom:0}
#cap{position:fixed;left:6vw;bottom:14vh;max-width:min(30ch,80vw);z-index:4;pointer-events:none;opacity:0;transition:opacity .6s}
#cap h2{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(1.8rem,4.2vw,3.4rem);line-height:1.05;letter-spacing:-.01em;text-shadow:0 2px 30px #000}
#cap p{margin-top:.7rem;font-size:clamp(.95rem,1.4vw,1.1rem);line-height:1.5;color:#d8cfc0;text-shadow:0 2px 20px #000}
#title{position:fixed;inset:0;z-index:4;display:grid;place-content:center;text-align:center;pointer-events:none;transition:opacity .8s}
#title h1{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:clamp(2.6rem,9vw,7rem);line-height:.95;text-shadow:0 4px 50px #000}
#title p{margin-top:1rem;color:#cfc5b4;font-size:clamp(.9rem,1.5vw,1.1rem)}
#play{position:fixed;right:5vw;bottom:calc(9vh + 18px);z-index:6;background:rgba(20,22,26,.55);color:#f3ece0;border:1px solid rgba(243,236,224,.35);padding:.65rem 1.1rem;border-radius:999px;font:500 .9rem 'DM Sans',sans-serif;cursor:pointer;backdrop-filter:blur(8px)}
#play:hover{background:rgba(243,236,224,.15)}
#play:focus-visible{outline:2px solid #f2c230;outline-offset:3px}
#prog{position:fixed;left:0;bottom:9vh;height:2px;width:0;background:#f2c230;z-index:6}
#fade{position:fixed;inset:0;background:#000;z-index:9;pointer-events:none;animation:fadeout 2.2s .4s forwards}@keyframes fadeout{to{opacity:0;visibility:hidden}}
#end{position:fixed;inset:0;z-index:4;display:grid;place-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity 1s}
#end h2{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:clamp(2rem,6vw,4.5rem)}
</style>
</head>
<body>
<div id="bg"></div>
<div id="stage"></div>
<canvas id="grain" width="160" height="160"></canvas>
<div class="vig"></div>
<div class="bar t"></div><div class="bar b"></div>
<div id="prog"></div>
<div id="title"><h1>Master Craft<br>Burger</h1><p>Un corto en un solo plano. Desliza para avanzar.</p></div>
<div id="cap"><h2></h2><p></p></div>
<div id="end"><h2>Fin.</h2></div>
<button id="play" type="button">Ver como película</button>
<div id="fade"></div>
<div class="scroll-space"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.addEventListener("error",e=>{const d=document.createElement("div");d.style.cssText="position:fixed;top:10vh;left:5vw;right:5vw;z-index:20;color:#f88;font:14px monospace";d.textContent="Error: "+e.message;document.body.appendChild(d)});
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W = () => innerWidth, H = () => innerHeight;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1c1f25, 16, 42);
const camera = new THREE.PerspectiveCamera(34, W()/H(), .1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(W(), H());
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

/* ---------- utilidades de canvas ---------- */
const mkCanvas = (w,h,fn) => { const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'),w,h); return c; };
const tex = (c, srgb=true) => { const t=new THREE.CanvasTexture(c); t.anisotropy=8; if(srgb) t.encoding=THREE.sRGBEncoding; t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; };
const rnd = (a,b) => a + Math.random()*(b-a);
const speckle = (x,w,h,n,cols,r0,r1) => { for(let i=0;i<n;i++){ x.fillStyle=cols[(Math.random()*cols.length)|0]; x.beginPath(); x.arc(rnd(0,w),rnd(0,h),rnd(r0,r1),0,7); x.fill(); } };

/* ---------- entorno de estudio (reflejos de softbox) ---------- */
const envC = mkCanvas(512,256,(x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#3a3f4a'); g.addColorStop(1,'#0e1013');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  x.fillStyle='#fff4e3'; x.fillRect(70,40,110,60);
  x.fillStyle='#b9cdea'; x.fillRect(360,60,60,90);
  x.fillStyle='#ffd9a8'; x.fillRect(220,20,70,25);
});
const envT = new THREE.CanvasTexture(envC); envT.mapping = THREE.EquirectangularReflectionMapping; envT.encoding = THREE.sRGBEncoding;
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromEquirectangular(envT).texture;

/* ---------- luces: softbox superior izquierdo, contraluz frío ---------- */
scene.add(new THREE.HemisphereLight(0xdfe6f5, 0x1a1c20, .55));
const key = new THREE.SpotLight(0xfff0dc, 2.6, 60, .5, .8);
key.position.set(-7,13,9); key.castShadow = true; key.shadow.mapSize.set(2048,2048); key.shadow.bias=-.0004;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x9db8e8, 1.4); rim.position.set(6,5,-7); scene.add(rim);
const warm = new THREE.PointLight(0xffb060, .9, 20); warm.position.set(4,-1,6); scene.add(warm);

/* ---------- texturas ---------- */
const bunT = tex(mkCanvas(512,512,(x,w,h)=>{
  const g=x.createRadialGradient(w*.4,h*.3,20,w/2,h/2,w*.7);
  g.addColorStop(0,'#e3a13c'); g.addColorStop(.6,'#c2691e'); g.addColorStop(1,'#8f4210');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  speckle(x,w,h,900,['rgba(255,220,140,.12)','rgba(90,35,5,.12)'],2,9);
}));
const crumbT = tex(mkCanvas(512,512,(x,w,h)=>{
  x.fillStyle='#f1dcae'; x.fillRect(0,0,w,h);
  speckle(x,w,h,2500,['rgba(200,150,80,.25)','rgba(255,245,215,.5)','rgba(170,115,50,.2)'],1,4);
}));
const pattyC = mkCanvas(512,512,(x,w,h)=>{
  x.fillStyle='#4d1f10'; x.fillRect(0,0,w,h);
  speckle(x,w,h,7000,['#6e2c14','#2a0e06','#8a3a1a','#3d1709'],1,5);
  x.strokeStyle='rgba(20,6,2,.5)'; x.lineWidth=10;
  for(let i=-4;i<10;i++){ x.beginPath(); x.moveTo(-20,i*70); x.lineTo(w+20,i*70+120); x.stroke(); }
  speckle(x,w,h,180,['rgba(255,170,110,.35)'],1,3);
});
const pattyT = tex(pattyC), pattyB = tex(pattyC,false);
const tomTop = tex(mkCanvas(512,512,(x,w,h)=>{
  x.fillStyle='#c72e1d'; x.beginPath(); x.arc(256,256,256,0,7); x.fill();
  x.fillStyle='#e04a2c'; x.beginPath(); x.arc(256,256,228,0,7); x.fill();
  for(let i=0;i<6;i++){ const a=i/6*6.283+.3;
    x.save(); x.translate(256+Math.cos(a)*105,256+Math.sin(a)*105); x.rotate(a);
    x.fillStyle='#f6a04a'; x.beginPath(); x.ellipse(0,0,88,56,0,0,7); x.fill();
    x.fillStyle='#fbd28a'; for(let k=0;k<7;k++){ x.beginPath(); x.ellipse(rnd(-50,50),rnd(-26,26),9,5,rnd(0,3),0,7); x.fill(); }
    x.restore(); }
  x.fillStyle='#f5d9c0'; x.beginPath(); x.arc(256,256,32,0,7); x.fill();
}));
const tomSide = new THREE.MeshStandardMaterial({color:0xc42a18, roughness:.25});
const lettT = tex(mkCanvas(512,512,(x,w,h)=>{
  const g=x.createLinearGradient(0,0,w,h); g.addColorStop(0,'#5fae2e'); g.addColorStop(.5,'#3f8a1f'); g.addColorStop(1,'#7cc23a');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(215,240,150,.45)'; x.lineWidth=3;
  for(let i=0;i<16;i++){ x.beginPath(); x.moveTo(256,256); x.quadraticCurveTo(rnd(0,w),rnd(0,h),rnd(0,w),rnd(0,h)); x.stroke(); }
  speckle(x,w,h,600,['rgba(20,70,10,.2)','rgba(200,240,120,.15)'],2,8);
}));

/* ---------- materiales ---------- */
const M = {
  bun: new THREE.MeshPhysicalMaterial({map:bunT, roughness:.38, clearcoat:.6, clearcoatRoughness:.3}),
  crumb: new THREE.MeshStandardMaterial({map:crumbT, roughness:.95}),
  patty: new THREE.MeshStandardMaterial({map:pattyT, bumpMap:pattyB, bumpScale:6, roughness:.5}),
  sesame: new THREE.MeshStandardMaterial({color:0xf0e2b8, roughness:.5}),
  cheese: new THREE.MeshPhysicalMaterial({color:0xf5c228, roughness:.3, clearcoat:.5, side:THREE.DoubleSide}),
  onion: new THREE.MeshPhysicalMaterial({color:0xf7f1e2, roughness:.25, clearcoat:.6}),
  lettuce: new THREE.MeshStandardMaterial({map:lettT, roughness:.45, side:THREE.DoubleSide}),
  ketchup: new THREE.MeshPhysicalMaterial({color:0xb01808, roughness:.1, clearcoat:1}),
  plate: new THREE.MeshPhysicalMaterial({color:0x1b2231, roughness:.28, metalness:.15, clearcoat:.4, side:THREE.DoubleSide}),
  table: new THREE.MeshStandardMaterial({color:0x17191d, roughness:.85})
};

/* ---------- piezas ---------- */
function domeBun(R, Hh, sesame){
  const g = new THREE.Group();
  const geo = new THREE.SphereGeometry(1,64,32,0,Math.PI*2,0,Math.PI/2);
  const d = new THREE.Mesh(geo, M.bun); d.scale.set(R,Hh,R); g.add(d);
  const cap = new THREE.Mesh(new THREE.CircleGeometry(R*.995,64), M.crumb); cap.rotation.x=Math.PI/2; cap.position.y=.01; g.add(cap);
  if(sesame){
    const sg = new THREE.SphereGeometry(.05,8,6);
    for(let i=0;i<110;i++){
      const th = Math.acos(rnd(.5,1)) , ph = rnd(0,6.283);
      const s = new THREE.Mesh(sg, M.sesame); s.scale.set(1.5,.55,.8);
      const n = new THREE.Vector3(Math.sin(th)*Math.cos(ph)/R, Math.cos(th)/Hh, Math.sin(th)*Math.sin(ph)/R).normalize();
      s.position.set(R*Math.sin(th)*Math.cos(ph), Hh*Math.cos(th), R*Math.sin(th)*Math.sin(ph));
      s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), n); s.rotateY(rnd(0,6));
      g.add(s);
    }
  }
  return g;
}
function heelBun(R, Hh){
  const g = new THREE.Group();
  const d = new THREE.Mesh(new THREE.SphereGeometry(1,64,16,0,Math.PI*2,Math.PI/2,Math.PI/2), M.bun); d.scale.set(R,Hh,R); g.add(d);
  const cap = new THREE.Mesh(new THREE.CircleGeometry(R*.995,64), M.crumb); cap.rotation.x=-Math.PI/2; g.add(cap);
  return g;
}
function lettuce(rad, sx=1, sz=1, seed=0){
  const geo = new THREE.RingGeometry(.02,1,72,14); geo.rotateX(-Math.PI/2);
  const p = geo.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i), z=p.getZ(i); const r=Math.hypot(x,z), a=Math.atan2(z,x);
    const m = 1 + .12*Math.sin(a*5+seed) + .07*Math.sin(a*11);
    p.setX(i,x*m*sx*rad); p.setZ(i,z*m*sz*rad);
    p.setY(i, (.16*Math.sin(a*9+r*4+seed) + .08*Math.sin(r*16+a*3))*r*rad*.6 + r*r*.12*rad);
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, M.lettuce);
}
function patty(R){
  const geo = new THREE.CylinderGeometry(R,R*.96,.34,64,4);
  const p = geo.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i); const r=Math.hypot(x,z), a=Math.atan2(z,x);
    const k = 1 + .045*Math.sin(a*7)+.03*Math.sin(a*13); p.setX(i,x*k); p.setZ(i,z*k);
    if(p.getY(i)>0) p.setY(i, p.getY(i)+.03*Math.sin(x*9)*Math.cos(z*8)); }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, M.patty);
}
function tomato(R){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(R,R,.12,48), [tomSide, new THREE.MeshStandardMaterial({map:tomTop,roughness:.2}), new THREE.MeshStandardMaterial({map:tomTop,roughness:.2})]);
  m.material[1].map.center.set(.5,.5); m.material[1].map.wrapS=m.material[1].map.wrapT=THREE.ClampToEdgeWrapping;
  return m;
}
function cheeseSheet(s){
  const geo = new THREE.PlaneGeometry(s,s,16,16); geo.rotateX(-Math.PI/2);
  const p = geo.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i); p.setY(i, -.09*(x*x+z*z)/(s*s)*4 + .12*Math.sin(x*3)*Math.cos(z*2.4)); }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, M.cheese); m.rotation.y = Math.PI/4; const g = new THREE.Group(); g.add(m); return g;
}

/* ---------- ensamblado ---------- */
const burger = new THREE.Group(); scene.add(burger);
const layers = [];
function add(obj, a, e, ra, re, delay, amp=1){
  burger.add(obj); layers.push({o:obj,a,e,ra,re,d:delay,amp,ph:Math.random()*6.28});
}
const topBun = domeBun(1.75,1.05,true);
add(topBun,[0,-.35,0],[.15,3.15,.3],[0,0,0],[-.55,.3,.1],0);
const p1 = patty(1.4); p1.scale.set(1,1,.8);
add(p1,[0,-.75,0],[.05,2.35,-.1],[0,0,0],[-.2,-.1,.05],.05);
const t1 = tomato(.9), t2 = tomato(.78);
add(t1,[-.35,-.98,.2],[-.55,1.45,.9],[0,0,0],[1.2,.1,.25],.1);
add(t2,[.4,-.9,-.1],[.95,1.15,.5],[0,0,0],[.85,-.2,-.6],.14);
const o1 = new THREE.Mesh(new THREE.TorusGeometry(.95,.055,14,72), M.onion);
const o2 = new THREE.Mesh(new THREE.TorusGeometry(.82,.05,14,72), M.onion);
add(o1,[0,-.6,0],[1.95,1.9,-.2],[Math.PI/2,0,0],[.55,.2,.35],.12);
add(o2,[0,-1.05,.1],[-1.05,.4,1],[Math.PI/2,0,0],[.65,0,-.1],.2);
const mid = new THREE.Group(); mid.add(heelBun(1.6,.42)); const l1=lettuce(1.25,1,1,1); l1.position.y=.12; mid.add(l1);
add(mid,[0,-1.25,0],[-.05,.7,0],[0,0,0],[.2,.1,-.12],.22);
const p2 = patty(1.35);
add(p2,[0,-1.5,0],[-.35,-.25,.2],[0,0,0],[.15,.3,.12],.3);
const ch = cheeseSheet(2.5);
add(ch,[0,-1.72,0],[.55,-.7,.3],[0,0,0],[.35,.15,-.3],.36);
const bot = new THREE.Group(); bot.add(heelBun(1.62,.5));
const l2 = lettuce(1.2,1,1,3); l2.position.y=.14; l2.rotation.z=.08; bot.add(l2);
const ket = new THREE.Mesh(new THREE.SphereGeometry(1,20,12), M.ketchup); ket.scale.set(.5,.09,.22); ket.position.set(.7,.42,.85); bot.add(ket);
const drip = new THREE.Mesh(new THREE.SphereGeometry(1,16,12), M.ketchup); drip.scale.set(.06,.28,.06); drip.position.set(.95,.14,1.0); bot.add(drip);
add(bot,[0,-2.0,0],[0,-1.6,.15],[0,0,0],[-.05,-.15,.06],.45);
/* hojas sueltas de lechuga y gotas */
const leaves = [[-2.3,3.4,-.2,.55],[2.35,2.65,-.4,.45],[2.0,1.5,-.5,.4],[-2.35,-.55,.4,.5]];
leaves.forEach((L,i)=>{ const m = lettuce(L[3],1,1.6,i*2); m.material=M.lettuce;
  add(m,[0,-.5,0],[L[0],L[1],L[2]],[0,0,0],[rnd(-1,1),rnd(0,3),rnd(-1,1)],.1+.08*i,1.6); });
burger.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });

/* ---------- plato, mesa, sombra de contacto ---------- */
const PY = -2.85;
const plate = new THREE.Mesh(new THREE.LatheGeometry([[0,0],[2.6,0],[3.1,.1],[3.75,.36],[3.85,.4],[3.85,.36],[3.7,.3],[2.6,-.02],[0,-.02]].map(a=>new THREE.Vector2(a[0],a[1])),96), M.plate);
plate.position.y = PY; plate.receiveShadow = true; plate.castShadow=true; scene.add(plate);
const table = new THREE.Mesh(new THREE.PlaneGeometry(120,120), M.table); table.rotation.x=-Math.PI/2; table.position.y=PY-.04; table.receiveShadow=true; scene.add(table);
const blob = new THREE.Mesh(new THREE.PlaneGeometry(6,6), new THREE.MeshBasicMaterial({map:tex(mkCanvas(128,128,(x)=>{const g=x.createRadialGradient(64,64,4,64,64,64);g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);}),false),transparent:true,depthWrite:false}));
blob.rotation.x=-Math.PI/2; blob.position.y=PY+.43; scene.add(blob);

/* ---------- bokeh flotante ---------- */
const bN=70, bPos=new Float32Array(bN*3);
for(let i=0;i<bN;i++){ bPos.set([rnd(-14,14),rnd(-3,10),rnd(-16,-2)],i*3); }
const bGeo = new THREE.BufferGeometry(); bGeo.setAttribute('position',new THREE.BufferAttribute(bPos,3));
const bokeh = new THREE.Points(bGeo,new THREE.PointsMaterial({size:.9,map:tex(mkCanvas(64,64,(x)=>{const g=x.createRadialGradient(32,32,2,32,32,32);g.addColorStop(0,'rgba(255,220,170,.9)');g.addColorStop(1,'rgba(255,220,170,0)');x.fillStyle=g;x.fillRect(0,0,64,64);}),false),transparent:true,opacity:.16,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
scene.add(bokeh);

/* ---------- cámara: recorrido de la película ---------- */
const V = (a)=>new THREE.Vector3(...a);
const camPath = new THREE.CatmullRomCurve3([
  [0,-.4,8.5],[0,.2,10.5],[0,.5,15.5],[-1.6,3.7,6.6],[2.6,1.8,6.2],[-2.4,-.6,6.4],[1.2,-1.9,6.4],[0,.6,17]
].map(V),false,'catmullrom',.5);
const lookPath = new THREE.CatmullRomCurve3([
  [0,-1.2,0],[0,-.6,0],[0,.4,0],[0,3.1,0],[.3,1.5,0],[-.2,-.3,0],[.4,-1.6,0],[0,.4,0]
].map(V),false,'catmullrom',.5);
const CAPS = [
  [.00,.10,null],
  [.14,.34,['Todo en el aire','Pan, carne, tomate, queso y lechuga, sostenidos por un instante.']],
  [.42,.55,['Pan brioche','Corteza dorada, brillante, con semillas de sésamo.']],
  [.58,.70,['Tomate y cebolla','Rodajas maduras y aros blancos que giran despacio.']],
  [.73,.83,['Carne y queso','Sellada a la parrilla, con cheddar amarillo intenso.']],
  [.86,.94,['Un toque de kétchup','Sobre lechuga fresca y el pan de la base.']]
];

/* ---------- bucle ---------- */
const ss = (a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const cap = document.getElementById('cap'), capH = cap.querySelector('h2'), capP = cap.querySelector('p');
const titleEl = document.getElementById('title'), endEl = document.getElementById('end'), progEl = document.getElementById('prog');
let target=0, P=0, lastCap=null;
const onScroll=()=>{ const m=document.documentElement.scrollHeight-innerHeight; target = m>0? scrollY/m : 0; };
addEventListener('scroll',onScroll,{passive:true}); onScroll();
const clock = new THREE.Clock();
const tmpL = new THREE.Vector3();

function frame(){
  requestAnimationFrame(frame);
  const t = clock.getElapsedTime();
  P += (target-P)*(RM?1:.05);
  const E = ss(.09,.36,P);

  layers.forEach(L=>{
    const k = ss(L.d*.6, 1, E*1.0 + (E>0?0:0)) ;
    const kk = Math.min(1, Math.max(0,(E-L.d*.35)/(1-L.d*.35)));
    const e = kk*kk*(3-2*kk), f = RM?0:1;
    const fl = e*f;
    L.o.position.set(
      L.a[0]+(L.e[0]-L.a[0])*e + Math.sin(t*.6+L.ph)*.05*fl*L.amp,
      L.a[1]+(L.e[1]-L.a[1])*e + Math.sin(t*.8+L.ph)*.09*fl*L.amp,
      L.a[2]+(L.e[2]-L.a[2])*e);
    L.o.rotation.set(
      L.ra[0]+(L.re[0]-L.ra[0])*e + Math.sin(t*.5+L.ph)*.05*fl*L.amp,
      L.ra[1]+(L.re[1]-L.ra[1])*e + t*.05*fl*(L.amp>1?1:0),
      L.ra[2]+(L.re[2]-L.ra[2])*e + Math.cos(t*.4+L.ph)*.04*fl*L.amp);
  });
  burger.rotation.y = Math.sin(t*.25)*.12*(RM?0:1) + (P-.4)*.25;

  const u = Math.min(.999, P);
  camera.position.copy(camPath.getPoint(u));
  camera.position.x += Math.sin(t*.35)*.12*(RM?0:1);
  camera.lookAt(lookPath.getPoint(u));
  blob.scale.setScalar(1 + E*.35); blob.material.opacity = .95 - E*.35;

  const p = bGeo.attributes.position;
  for(let i=0;i<bN;i++){ let y=p.getY(i)+.004; if(y>10) y=-3; p.setY(i,y); }
  p.needsUpdate = true;

  /* textos */
  titleEl.style.opacity = 1-ss(.02,.09,P);
  let c=null; for(const s of CAPS){ if(P>=s[0]&&P<=s[1]&&s[2]) c=s[2]; }
  if(c!==lastCap){ lastCap=c; if(c){ capH.textContent=c[0]; capP.textContent=c[1]; } cap.style.opacity = c?1:0; }
  endEl.style.opacity = ss(.965,.995,P);
  progEl.style.width = (P*100)+'%';
  renderer.render(scene,camera);
}

/* ---------- grano de película ---------- */
const gc = document.getElementById('grain'), gx = gc.getContext('2d'), gd = gx.createImageData(160,160);
let gt=0;
function grain(ts){
  requestAnimationFrame(grain);
  if(RM || ts-gt<70) return; gt=ts;
  for(let i=0;i<gd.data.length;i+=4){ const v=Math.random()*255; gd.data[i]=gd.data[i+1]=gd.data[i+2]=v; gd.data[i+3]=255; }
  gx.putImageData(gd,0,0);
}
requestAnimationFrame(grain);

/* ---------- reproducir como película ---------- */
const btn = document.getElementById('play'); let playing=false, raf=0;
function stop(){ playing=false; cancelAnimationFrame(raf); btn.textContent='Ver como película'; }
btn.addEventListener('click',()=>{
  if(playing){ stop(); return; }
  playing=true; btn.textContent='Pausar';
  const total = document.documentElement.scrollHeight-innerHeight, DUR = 70000;
  let start = performance.now() - (scrollY/total)*DUR;
  const step = now=>{ if(!playing) return; const k=Math.min(1,(now-start)/DUR); window.scrollTo(0,k*total); if(k<1) raf=requestAnimationFrame(step); else stop(); };
  raf=requestAnimationFrame(step);
});
['wheel','touchstart','keydown'].forEach(ev=>addEventListener(ev,()=>{ if(playing) stop(); },{passive:true}));

addEventListener('resize',()=>{
  camera.aspect=W()/H(); camera.fov = W()<H()?48:34; camera.updateProjectionMatrix(); renderer.setSize(W(),H());
});
camera.fov = W()<H()?48:34; camera.updateProjectionMatrix();
frame();

</script>
